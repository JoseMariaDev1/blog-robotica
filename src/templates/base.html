{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Artículos y notas sobre robótica.">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header class="site-header">
    <a class="brand" href="{% url 'blog:home' %}" aria-label="{{ site_name }}, portada">
      <span class="brand-mark" aria-hidden="true">BR</span>
      <span>{{ site_name }}</span>
    </a>
    <nav class="main-nav" aria-label="Navegación principal">
      <a href="{% url 'blog:home' %}" {% if request.resolver_match.url_name == 'home' %}aria-current="page"{% endif %}>Artículos</a>
      <a href="{% url 'blog:about' %}" {% if request.resolver_match.url_name == 'about' %}aria-current="page"{% endif %}>Sobre mí</a>
    </nav>
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <a href="{% url 'blog:home' %}">{{ site_name }}</a>
    <span>Robótica, sistemas y experimentos</span>
  </footer>
</body>
</html>
